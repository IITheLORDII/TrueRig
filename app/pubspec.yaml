name: darbogaz
description: "PC darboğaz, uyumluluk, FPS ve fiyat karşılaştırma uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^8.0.0
  url_launcher: ^6.3.3
  mobile_scanner: ^7.4.2
  http: ^1.6.0
  intl: ^0.20.3
  perf_engine:
    path: ../packages/perf_engine
  cached_network_image: ^4.0.4
  web: ^1.1.1
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Brand assets are rendered from lib/core/brand/truerig_logo.dart by
# `flutter test tool/brand_assets_test.dart`, then:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/brand/icon_1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/icon_1024.png
    background_color: "#0B0F1A"
    theme_color: "#0B0F1A"

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#0B0F1A"
    image: assets/brand/splash_logo.png
  web: true
