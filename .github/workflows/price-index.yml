name: Price index

# Once a day: read prices from store product pages that robots.txt allows
# (found via the stores' sitemaps) and publish prices.json on the
# `prices-data` branch, where the app downloads it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Product pages per store
        default: "300"

permissions:
  contents: write

concurrency:
  group: price-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Catalog items
        working-directory: packages/perf_engine
        run: |
          dart pub get
          dart run tool/export_price_items.dart > "$RUNNER_TEMP/items.json"

      - name: Previous index
        run: |
          git show origin/prices-data:prices.json > "$RUNNER_TEMP/previous.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/previous.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Crawl
        # The input reaches the shell only through an environment variable
        # and must be a plain number (no script injection).
        env:
          LIMIT: ${{ github.event.inputs.limit || '300' }}
        run: |
          case "$LIMIT" in
            ''|*[!0-9]*) echo "limit must be a number" >&2; exit 1 ;;
          esac
          if [ "$LIMIT" -gt 2000 ]; then echo "limit too large" >&2; exit 1; fi
          node --experimental-strip-types tool/price-index/run.ts \
            --items "$RUNNER_TEMP/items.json" \
            --previous "$RUNNER_TEMP/previous.json" \
            --out "$RUNNER_TEMP/prices.json" \
            --limit "$LIMIT"

      - name: Publish
        run: |
          git config user.name "truerig-price-bot"
          git config user.email "truerig-price-bot@users.noreply.github.com"
          git worktree add --orphan -b publish "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP/prices.json" "$RUNNER_TEMP/publish/prices.json"
          cd "$RUNNER_TEMP/publish"
          git add prices.json
          git commit -m "data: price index $(date -u +%Y-%m-%d)"
          git push --force origin HEAD:prices-data
